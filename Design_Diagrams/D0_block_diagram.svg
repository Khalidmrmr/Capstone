<text x="30" y="42" text-anchor="start" font-size="26" font-weight="bold" fill="#000000">Smart Closet Mirror — D0 Block Diagram</text>
<text x="30" y="74" text-anchor="start" font-size="15" font-weight="normal" fill="#000000">Goal: turn a Gen 1 Mirror into a closet mirror that measures the user with a Kinect, shows their own</text>
<text x="30" y="94" text-anchor="start" font-size="15" font-weight="normal" fill="#000000">clothes and shop items on their body, and tells them what to wear today and whether a new piece is worth buying.</text>
<text x="30" y="122" text-anchor="start" font-size="14" font-weight="normal" fill="#000000">Basic input: the person in front of the glass (Kinect colour + depth, Mirror presence/voice), garment photos from the phone,</text>
<text x="30" y="141" text-anchor="start" font-size="14" font-weight="normal" fill="#000000">calendar and shop data.   Basic output: live try-on video and decision cards (today&#x27;s outfit, buy/skip verdict) on the glass.</text>
<text x="1180" y="180" text-anchor="end" font-size="15" font-weight="bold" fill="#000000">Brain computer (Ubuntu PC)</text>
<text x="36" y="1012" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">Legend</text>
<text x="112.0" y="1042" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">Component we build (layer Lx)</text>
<text x="588.6666666666667" y="1042" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">External system / device we depend on</text>
<text x="1065.3333333333335" y="1042" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">Boundary: hardware platform or our computer</text>
<text x="112.0" y="1076" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">Internal interface (message bus), arrow = data direction</text>
<text x="588.6666666666667" y="1076" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">External interface (leaves the brain computer)</text>
<text x="1065.3333333333335" y="1076" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">Two-headed = request / response</text>
<text x="112.0" y="1110" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">Shared plane (no direct lines; used by all)</text>
<text x="40" y="1148" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">I-numbers match the Interface Specification table. Where two lines cross (I11 over I15) they are not connected.</text>
</svg>