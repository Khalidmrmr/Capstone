<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 930" width="1480" height="930" font-family="Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect width="1480" height="930" fill="#fff"/>
<text x="30" y="44" font-size="26" font-weight="bold">Smart Closet Mirror — Fig D2-5: Camera capture consent state machine (L8 + L1, US-04)</text>
<text x="30" y="76" font-size="15">Goal: Turn a Gen 1 Mirror into a closet mirror that measures the user with a Kinect, shows their own clothes and shop items</text>
<text x="30" y="96" font-size="15">on their body, and tells them what to wear today and whether a new piece is worth buying.</text>
<rect x="20" y="770" width="1440" height="114" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="300" y="180" width="1150" height="380" rx="16" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="12,7"/>
<text x="314" y="204" font-size="15" font-weight="bold">Camera state verified by L1 (capture.status, I27)</text>
<rect x="973.3333333333334" y="844" width="64" height="24" rx="16" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="12,7"/>
<text x="987.3333333333334" y="868" font-size="15" font-weight="bold"></text>
<circle cx="61.0" cy="356.0" r="11.0" fill="#000"/>
<rect x="340" y="320" width="230" height="82" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="455.0" y="347.0" font-size="15" text-anchor="middle" font-weight="bold">Off</text>
<text x="455.0" y="365.0" font-size="12.5" text-anchor="middle">indicator &#x27;Camera off&#x27;</text>
<text x="455.0" y="383.0" font-size="12.5" text-anchor="middle">Kinect closed, LED off</text>
<rect x="760" y="320" width="230" height="82" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="875.0" y="347.0" font-size="15" text-anchor="middle" font-weight="bold">Asking</text>
<text x="875.0" y="365.0" font-size="12.5" text-anchor="middle">&#x27;Allow the camera for</text>
<text x="875.0" y="383.0" font-size="12.5" text-anchor="middle">this session?&#x27;</text>
<rect x="1180" y="320" width="230" height="82" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1295.0" y="347.0" font-size="15" text-anchor="middle" font-weight="bold">On</text>
<text x="1295.0" y="365.0" font-size="12.5" text-anchor="middle">indicator &#x27;Camera on&#x27;</text>
<text x="1295.0" y="383.0" font-size="12.5" text-anchor="middle">Kinect open, LED green</text>
<rect x="760" y="640" width="300" height="82" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="7,4"/>
<text x="910.0" y="667.0" font-size="15" text-anchor="middle" font-weight="bold">Unknown</text>
<text x="910.0" y="685.0" font-size="12.5" text-anchor="middle">&#x27;Camera status unknown&#x27;</text>
<text x="910.0" y="703.0" font-size="12.5" text-anchor="middle">image functions blocked</text>
<rect x="1100" y="600" width="350" height="130" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="1112" y="622" font-size="13">Rules</text>
<text x="1112" y="640" font-size="13">• Default is Off; consent lasts one session.</text>
<text x="1112" y="658" font-size="13">• L1 and L2 keep frames in memory only;</text>
<text x="1112" y="676" font-size="13">   no code path writes images (C-02.1).</text>
<text x="1112" y="694" font-size="13">• Phone garment photos are user uploads,</text>
<text x="1112" y="712" font-size="13">   not camera capture.</text>
<rect x="40.0" y="810" width="64" height="24" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="72.0" y="826.0" font-size="15" text-anchor="middle" font-weight="bold"></text>
<rect x="506.6666666666667" y="810" width="64" height="24" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="7,4"/>
<text x="538.6666666666667" y="826.0" font-size="15" text-anchor="middle" font-weight="bold"></text>
<circle cx="1005.3333333333334" cy="821.0" r="10.0" fill="#000"/>
<polyline points="72,356 340,356" fill="none" stroke="#fff" stroke-width="8"/>
<polyline points="72,356 340,356" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="570,340 760,340" fill="none" stroke="#fff" stroke-width="8"/>
<polyline points="570,340 760,340" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="760,384 570,384" fill="none" stroke="#fff" stroke-width="8"/>
<polyline points="760,384 570,384" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="990,340 1180,340" fill="none" stroke="#fff" stroke-width="8"/>
<polyline points="990,340 1180,340" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="1295,402 1295,500 455,500 455,402" fill="none" stroke="#fff" stroke-width="8"/>
<polyline points="1295,402 1295,500 455,500 455,402" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="910,560 910,640" fill="none" stroke="#fff" stroke-width="8"/>
<polyline points="910,560 910,640" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="9,6" marker-end="url(#ar)"/>
<polyline points="760,700 420,700 420,402" fill="none" stroke="#fff" stroke-width="8"/>
<polyline points="760,700 420,700 420,402" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="40.0,855 104.0,855" fill="none" stroke="#fff" stroke-width="8"/>
<polyline points="40.0,855 104.0,855" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="506.6666666666667,855 570.6666666666667,855" fill="none" stroke="#fff" stroke-width="8"/>
<polyline points="506.6666666666667,855 570.6666666666667,855" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="9,6" marker-end="url(#ar)"/>
<rect x="146.5" y="317" width="107.0" height="36" fill="#fff"/>
<text x="200" y="330" font-size="12.5" font-style="italic" text-anchor="middle">boot, and every</text>
<text x="200" y="346" font-size="12.5" font-style="italic" text-anchor="middle">new session</text>
<rect x="578.5" y="299" width="173.0" height="36" fill="#fff"/>
<text x="665" y="312" font-size="12.5" font-style="italic" text-anchor="middle">try, measure, or gestures</text>
<text x="665" y="328" font-size="12.5" font-style="italic" text-anchor="middle">requested</text>
<rect x="548.8" y="407" width="232.39999999999998" height="36" fill="#fff"/>
<text x="665" y="420" font-size="12.5" font-style="italic" text-anchor="middle">declined, or no answer in 15 s /</text>
<text x="665" y="436" font-size="12.5" font-style="italic" text-anchor="middle">log ConsentEvent; nothing captured</text>
<rect x="991.9" y="299" width="186.2" height="36" fill="#fff"/>
<text x="1085" y="312" font-size="12.5" font-style="italic" text-anchor="middle">explicit &#x27;Allow&#x27; /</text>
<text x="1085" y="328" font-size="12.5" font-style="italic" text-anchor="middle">capture.enable; L1 confirms</text>
<rect x="620.2" y="479" width="509.59999999999997" height="20" fill="#fff"/>
<text x="875" y="492" font-size="12.5" font-style="italic" text-anchor="middle">revoke (touch or voice), or session ends / capture.disable; L1 closes device</text>
<rect x="684.8" y="579" width="219.2" height="36" fill="#fff"/>
<text x="900" y="592" font-size="12.5" font-style="italic" text-anchor="end">no status reply in 2 s, or</text>
<text x="900" y="608" font-size="12.5" font-style="italic" text-anchor="end">reply contradicts expected state</text>
<rect x="480.4" y="677" width="219.2" height="20" fill="#fff"/>
<text x="590" y="690" font-size="12.5" font-style="italic" text-anchor="middle">L1 verifies the Kinect is closed</text>
<text x="30" y="142" font-size="14" text-anchor="start">L8 owns the prompt and the on-glass indicator; L1 is the only component that can open the Kinect and does so only after capture.enable (I27).</text>
<text x="36" y="794" font-size="15" text-anchor="start" font-weight="bold">Legend</text>
<text x="118.0" y="826" font-size="13" text-anchor="start">State</text>
<text x="584.6666666666667" y="826" font-size="13" text-anchor="start">Error state</text>
<text x="1051.3333333333335" y="826" font-size="13" text-anchor="start">Start (first state on power-up)</text>
<text x="118.0" y="860" font-size="13" text-anchor="start">Transition: trigger / action</text>
<text x="584.6666666666667" y="860" font-size="13" text-anchor="start">Error or timeout transition</text>
<text x="1051.3333333333335" y="860" font-size="13" text-anchor="start">Group: an arrow leaving it applies to every state inside</text>
</svg>