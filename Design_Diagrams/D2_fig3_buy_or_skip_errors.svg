<text x="580.0" y="247.0" font-size="15" text-anchor="middle" font-weight="bold">Found and</text>
<text x="580.0" y="265.0" font-size="12.5" text-anchor="middle">complete?</text>
<polygon points="815.0,197 900,252.0 815.0,307 730,252.0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="815.0" y="247.0" font-size="15" text-anchor="middle" font-weight="bold">Current</text>
<text x="815.0" y="265.0" font-size="12.5" text-anchor="middle">profile OK?</text>
<rect x="960" y="210" width="190" height="84" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1055.0" y="247.0" font-size="15" text-anchor="middle" font-weight="bold">L5 fit check</text>
<text x="1055.0" y="265.0" font-size="12.5" text-anchor="middle">tryon.request (I12)</text>
<polygon points="1290.0,197 1375,252.0 1290.0,307 1205,252.0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1290.0" y="247.0" font-size="15" text-anchor="middle" font-weight="bold">Fit back</text>
<text x="1290.0" y="265.0" font-size="12.5" text-anchor="middle">within 1.5 s?</text>
<rect x="1195" y="585" width="190" height="84" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1290.0" y="622.0" font-size="15" text-anchor="middle" font-weight="bold">L7 refreshes price</text>
<text x="1290.0" y="640.0" font-size="12.5" text-anchor="middle">ctx.products (I14b)</text>
<polygon points="1045.0,572 1130,627.0 1045.0,682 960,627.0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1045.0" y="631.0" font-size="15" text-anchor="middle" font-weight="bold">Price fresh?</text>
<rect x="720" y="585" width="190" height="84" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="815.0" y="622.0" font-size="15" text-anchor="middle" font-weight="bold">L6 verdict</text>
<text x="815.0" y="640.0" font-size="12.5" text-anchor="middle">algorithm A5</text>
<polygon points="570.0,572 655,627.0 570.0,682 485,627.0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="570.0" y="622.0" font-size="15" text-anchor="middle" font-weight="bold">L8 socket</text>
<text x="570.0" y="640.0" font-size="12.5" text-anchor="middle">connected?</text>
<rect x="230" y="585" width="200" height="84" rx="14" fill="#fff" stroke="#000" stroke-width="4.5"/>
<text x="330.0" y="622.0" font-size="15" text-anchor="middle" font-weight="bold">Card on glass</text>
<text x="330.0" y="640.0" font-size="12.5" text-anchor="middle">≤ 2 s after asking</text>
<rect x="455" y="395" width="250" height="105" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="7,4"/>
<text x="580.0" y="424.5" font-size="15" text-anchor="middle" font-weight="bold">SURFACE ERROR · L6</text>
<text x="580.0" y="442.5" font-size="12.5" text-anchor="middle">card: &#x27;item no longer</text>
<text x="580.0" y="460.5" font-size="12.5" text-anchor="middle">available&#x27;. Ends this</text>
<text x="580.0" y="478.5" font-size="12.5" text-anchor="middle">request (not recoverable).</text>
<rect x="720" y="395" width="210" height="105" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="7,4"/>
<text x="825.0" y="424.5" font-size="15" text-anchor="middle" font-weight="bold">RECOVER · L8 + L2</text>
<text x="825.0" y="442.5" font-size="12.5" text-anchor="middle">go to Measuring</text>
<text x="825.0" y="460.5" font-size="12.5" text-anchor="middle">(Fig D2-2); ask again</text>
<text x="825.0" y="478.5" font-size="12.5" text-anchor="middle">when done.</text>
<rect x="1165" y="395" width="250" height="105" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="7,4"/>
<text x="1290.0" y="424.5" font-size="15" text-anchor="middle" font-weight="bold">DEGRADE · L6</text>
<text x="1290.0" y="442.5" font-size="12.5" text-anchor="middle">decide without fit;</text>
<text x="1290.0" y="460.5" font-size="12.5" text-anchor="middle">card says &#x27;fit pending&#x27;;</text>
<text x="1290.0" y="478.5" font-size="12.5" text-anchor="middle">late report updates it.</text>
<rect x="925" y="790" width="250" height="105" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="7,4"/>
<text x="1050.0" y="828.5" font-size="15" text-anchor="middle" font-weight="bold">FALL BACK · L7 → L6</text>
<text x="1050.0" y="846.5" font-size="12.5" text-anchor="middle">use cached price; card</text>
<text x="1050.0" y="864.5" font-size="12.5" text-anchor="middle">says &#x27;price from &lt;date&gt;&#x27;.</text>
<rect x="445" y="790" width="250" height="105" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="7,4"/>
<text x="570.0" y="819.5" font-size="15" text-anchor="middle" font-weight="bold">RETRY · Mirror + L8</text>
<text x="570.0" y="837.5" font-size="12.5" text-anchor="middle">WebView reconnects every</text>
<text x="570.0" y="855.5" font-size="12.5" text-anchor="middle">2 s; L8 resends the card.</text>
<text x="570.0" y="873.5" font-size="12.5" text-anchor="middle">Gives up at 30 s → Asleep.</text>
