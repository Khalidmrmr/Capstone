<rect width="1480" height="1110" fill="#fff"/>
<text x="30" y="44" font-size="26" font-weight="bold">Smart Closet Mirror — Fig D2-3: &#x27;Buy or skip?&#x27; decision flow with error paths</text>
<text x="30" y="76" font-size="15">Goal: Turn a Gen 1 Mirror into a closet mirror that measures the user with a Kinect, shows their own clothes and shop items</text>
<text x="30" y="96" font-size="15">on their body, and tells them what to wear today and whether a new piece is worth buying.</text>
<rect x="20" y="925" width="1440" height="145" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="20" y="210" width="190" height="84" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="115.0" y="238.0" font-size="15" text-anchor="middle" font-weight="bold">User asks</text>
<text x="115.0" y="256.0" font-size="12.5" text-anchor="middle">&#x27;buy or skip?&#x27;</text>
<text x="115.0" y="274.0" font-size="12.5" text-anchor="middle">L8 → L6 (I17)</text>
<rect x="255" y="210" width="190" height="84" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="350.0" y="247.0" font-size="15" text-anchor="middle" font-weight="bold">L6 loads item</text>
<text x="350.0" y="265.0" font-size="12.5" text-anchor="middle">wardrobe.get (I11)</text>
