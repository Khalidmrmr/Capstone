<text x="118.0" y="1015" font-size="13" text-anchor="start">Error outcome: decided behaviour · handler</text>
<text x="584.6666666666667" y="1015" font-size="13" text-anchor="start">Happy path</text>
<text x="1051.3333333333335" y="1015" font-size="13" text-anchor="start">Error path</text>
<text x="36" y="1047" font-size="13" text-anchor="start">Every error box names one of the four decided behaviours (retry, degrade, fall back, surface error) and the component that handles it.</text>
