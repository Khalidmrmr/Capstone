<text x="36" y="949" font-size="15" text-anchor="start" font-weight="bold">Legend</text>
<text x="118.0" y="981" font-size="13" text-anchor="start">Step (component, interface)</text>
<text x="584.6666666666667" y="981" font-size="13" text-anchor="start">Check</text>
