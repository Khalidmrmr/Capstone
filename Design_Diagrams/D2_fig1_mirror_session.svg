<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect width="1480" height="985" fill="#fff"/>
<text x="30" y="44" font-size="26" font-weight="bold">Smart Closet Mirror — Fig D2-1: Mirror session state machine (L8 Presentation)</text>
<text x="30" y="76" font-size="15">Goal: Turn a Gen 1 Mirror into a closet mirror that measures the user with a Kinect, shows their own clothes and shop items</text>
<text x="30" y="96" font-size="15">on their body, and tells them what to wear today and whether a new piece is worth buying.</text>
<rect x="20" y="855" width="1440" height="114" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="400" y="175" width="980" height="480" rx="16" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="12,7"/>
<text x="414" y="199" font-size="15" font-weight="bold">Awake (glass on)</text>
<rect x="973.3333333333334" y="929" width="64" height="24" rx="16" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="12,7"/>
<text x="987.3333333333334" y="953" font-size="15" font-weight="bold"></text>
