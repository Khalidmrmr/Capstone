<text x="790" y="696" font-size="12.5" font-style="italic" text-anchor="end">(I21 / I27)</text>
<rect x="986" y="669" width="113.6" height="36" fill="#fff"/>
<text x="990" y="682" font-size="12.5" font-style="italic" text-anchor="start">status verified:</text>
<text x="990" y="698" font-size="12.5" font-style="italic" text-anchor="start">back to Home</text>
<text x="30" y="142" font-size="14" text-anchor="start">Every transition is caused by a Mirror event (I5: touch or wake word), a user action (I17), or a capture-state event (I21, I27). L8 is the only component that changes these states.</text>
<text x="36" y="879" font-size="15" text-anchor="start" font-weight="bold">Legend</text>
<text x="118.0" y="911" font-size="13" text-anchor="start">State</text>
<text x="584.6666666666667" y="911" font-size="13" text-anchor="start">Error state</text>
<text x="1051.3333333333335" y="911" font-size="13" text-anchor="start">Start (first state on power-up)</text>
<text x="118.0" y="945" font-size="13" text-anchor="start">Transition: trigger / action</text>
<text x="584.6666666666667" y="945" font-size="13" text-anchor="start">Error or timeout transition</text>
<text x="1051.3333333333335" y="945" font-size="13" text-anchor="start">Group: an arrow leaving it applies to every state inside</text>
</svg>