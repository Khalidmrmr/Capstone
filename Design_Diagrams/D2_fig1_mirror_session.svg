<text x="220.0" y="429.0" font-size="12.5" text-anchor="middle">glass dark, camera off</text>
<rect x="440" y="380" width="200" height="72" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="540.0" y="411.0" font-size="15" text-anchor="middle" font-weight="bold">Waking</text>
<text x="540.0" y="429.0" font-size="12.5" text-anchor="middle">pick profile, enter PIN</text>
<rect x="760" y="380" width="200" height="72" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="860.0" y="411.0" font-size="15" text-anchor="middle" font-weight="bold">Home</text>
<text x="860.0" y="429.0" font-size="12.5" text-anchor="middle">today&#x27;s outfit, menu</text>
<rect x="760" y="205" width="200" height="72" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="860.0" y="236.0" font-size="15" text-anchor="middle" font-weight="bold">Measuring</text>
<text x="860.0" y="254.0" font-size="12.5" text-anchor="middle">T-pose guide (Fig D2-2)</text>
<rect x="1100" y="380" width="200" height="72" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1200.0" y="411.0" font-size="15" text-anchor="middle" font-weight="bold">TryOn</text>
<text x="1200.0" y="429.0" font-size="12.5" text-anchor="middle">live video (I4)</text>
<rect x="1100" y="555" width="200" height="72" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1200.0" y="586.0" font-size="15" text-anchor="middle" font-weight="bold">Verdict</text>
<text x="1200.0" y="604.0" font-size="12.5" text-anchor="middle">buy / skip card</text>
<rect x="760" y="720" width="280" height="72" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="7,4"/>
<text x="900.0" y="742.0" font-size="15" text-anchor="middle" font-weight="bold">CameraUnknown</text>
<text x="900.0" y="760.0" font-size="12.5" text-anchor="middle">&#x27;Camera status unknown&#x27;;</text>
<text x="900.0" y="778.0" font-size="12.5" text-anchor="middle">image functions blocked</text>
<rect x="30" y="720" width="690" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="42" y="742" font-size="13">Rules</text>
<text x="42" y="760" font-size="13">• [capture on] is a guard. If capture is off, &#x27;try&#x27; and &#x27;measure&#x27; open the consent prompt (Fig D2-5);</text>
<text x="42" y="778" font-size="13">   declining keeps the user on Home with the camera off.</text>
<text x="42" y="796" font-size="13">• Only the unlocked user&#x27;s wardrobe and cards are shown; Asleep ends the session (US-05).</text>
<text x="42" y="814" font-size="13">• Socket loss to the WebView is handled inside the Mirror: it reconnects every 2 s (I6).</text>
