<text x="1235" y="879" text-anchor="middle" font-size="14" font-weight="normal" fill="#000000">WebSocket</text>
<text x="30" y="42" text-anchor="start" font-size="26" font-weight="bold" fill="#000000">Smart Closet Mirror — D0 Data-Flow Diagram</text>
<text x="30" y="74" text-anchor="start" font-size="15" font-weight="normal" fill="#000000">Goal: turn a Gen 1 Mirror into a closet mirror that measures the user with a Kinect, shows their own</text>
<text x="30" y="94" text-anchor="start" font-size="15" font-weight="normal" fill="#000000">clothes and shop items on their body, and tells them what to wear today and whether a new piece is worth buying.</text>
<text x="30" y="122" text-anchor="start" font-size="14" font-weight="normal" fill="#000000">Basic input: the person in front of the glass (Kinect colour + depth, Mirror presence/voice), garment photos from the phone,</text>
<text x="30" y="141" text-anchor="start" font-size="14" font-weight="normal" fill="#000000">calendar and shop data.   Basic output: live try-on video and decision cards (today&#x27;s outfit, buy/skip verdict) on the glass.</text>
<text x="30" y="210" text-anchor="start" font-size="18" font-weight="bold" fill="#000000">Flow A — Live try-on (continuous, every frame)</text>
<text x="30" y="680" text-anchor="start" font-size="18" font-weight="bold" fill="#000000">Flow B — Decision: today&#x27;s outfit and buy / skip (on request or on wake)</text>
<text x="36" y="1192" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">Legend</text>
<text x="112.0" y="1222" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">Processing stage (our component)</text>
<text x="588.6666666666667" y="1222" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">External source or sink</text>
<text x="1065.3333333333335" y="1222" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">Timing budget set by a requirement</text>
<text x="112.0" y="1256" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">Data on the move: name, then its form</text>
<text x="588.6666666666667" y="1256" text-anchor="start" font-size="13" font-weight="normal" fill="#000000">Data crossing the system boundary</text>
